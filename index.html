<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéDex Ultimate</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@700;900&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="container">
        <div class="header-content">
            <div class="logo">PokéDex Ultimate</div>

            <div class="header-controls"
                style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; justify-content: center;">
                <div id="search-container" class="search-container glass-panel" style="
                    width: 50px;
                    height: 50px;
                    border-radius: 50%;
                    padding: 0;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    cursor: pointer;
                    transition: all 0.4s ease;
                    overflow: hidden;
                ">
                    <i id="search-toggle" class="fa-solid fa-search"
                        style="font-size: 1.2rem; color: var(--clr-accent); transition: all 0.3s;"></i>
                    <input type="text" id="search-input" class="search-input" placeholder="Search Pokemon..." style="
                        width: 0;
                        padding: 0;
                        border: none;
                        opacity: 0;
                        transition: all 0.4s ease;
                    ">
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Filters (Optional, can be added later) -->
        <div id="pokedex-grid" class="pokedex-grid">
            <!-- Cards will be injected here -->
            <div class="pokemon-card glass-panel" style="justify-content: center; height: 300px;">
                <i class="fa-solid fa-spinner fa-spin" style="font-size: 3rem; color: var(--clr-accent);"></i>
            </div>
        </div>
    </main>

    <!-- Back to Top Button -->
    <a href="#" id="back-to-top" title="Back to Top" style="
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 50px;
        height: 50px;
        background: linear-gradient(135deg, var(--clr-accent), var(--clr-accent-secondary));
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
        transition: all 0.3s ease;
        z-index: 999;
    " onmouseenter="this.style.transform='scale(1.1)'; this.style.boxShadow='0 6px 25px rgba(0, 255, 204, 0.6)';"
        onmouseleave="this.style.transform='scale(1)'; this.style.boxShadow='0 4px 15px rgba(0, 255, 204, 0.4)';">
        <i class="fa-solid fa-arrow-up" style="font-size: 1.2rem; color: #000;"></i>
    </a>

    <!-- Detailed Modal -->
    <div id="pokemon-modal" class="modal-overlay">
        <div class="glass-panel modal-content">
            <button id="close-modal" class="modal-close">&times;</button>

            <div class="modal-visuals" id="modal-visuals">
                <div id="modal-forms"
                    style="display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; margin-bottom: 1rem; max-width: 100%;">
                </div>
                <img src="" alt="" class="modal-img-big" id="modal-img">
            </div>

            <div class="modal-details">
                <h2 id="modal-name" style="text-transform: capitalize; font-size: 2.5rem; margin-bottom: 0.5rem;">
                    Pokemon Name</h2>
                <div id="modal-types" class="pokemon-types" style="justify-content: flex-start; margin-bottom: 2rem;">
                    <!-- Types -->
                </div>

                <div class="modal-section">
                    <h3 style="margin-bottom: 1rem; color: var(--clr-accent);">Base Stats</h3>
                    <div id="modal-stats">
                        <!-- Stats -->
                    </div>
                </div>

                <div class="modal-section" style="margin-top: 2rem;">
                    <h3 style="margin-bottom: 1rem; color: var(--clr-accent);">About</h3>
                    <p id="modal-desc" style="line-height: 1.6; color: var(--clr-text-muted);">
                        Flavor text goes here...
                    </p>
                </div>

                <div class="modal-section" style="margin-top: 2rem;">
                    <h3 style="margin-bottom: 1rem; color: var(--clr-accent);">Evolution Chain</h3>
                    <div id="modal-evolutions"
                        style="display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; justify-content: center;">
                        <!-- Evolution chain rendered here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
